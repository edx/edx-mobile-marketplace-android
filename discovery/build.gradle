import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    compileSdk = 35
    ndkVersion = "28.2.13676358"
    namespace 'org.openedx.discovery'
    compileSdkVersion compile_sdk_version

    defaultConfig {
        minSdk = 24
        targetSdk = 35
        minSdk min_sdk_version
        targetSdk target_sdk_version

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    namespace = 'org.openedx.discovery'

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.fromTarget("17")
            freeCompilerArgs.addAll(List.of("-Xstring-concat=inline"))
        }
    }

    buildFeatures {
        viewBinding = true
        compose = true
    }

    flavorDimensions += "env"
    productFlavors {
        prod {
            dimension = 'env'
        }
        develop {
            dimension = 'env'
        }
        stage {
            dimension = 'env'
        }
    }
}

dependencies {
    implementation project(path: ':core')

    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation "io.mockk:mockk:$mockk_version"
    testImplementation "io.mockk:mockk-android:$mockk_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation "androidx.arch.core:core-testing:$android_arch_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinx_coroutines_test_version"
    androidTestImplementation "androidx.test.ext:junit:$test_ext_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
}
